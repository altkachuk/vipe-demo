name: vipe
channels:
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  # =========================
  # Core
  # =========================
  - python=3.11
  - pip
  - numpy
  - scipy
  - tqdm
  - pyyaml

  # =========================
  # CUDA (toolkit only)
  # =========================
  - cuda-nvcc
  - libcublas-dev
  - libcusparse-dev
  - libcusolver-dev

  # =========================
  # Build / system
  # =========================
  - cmake
  - ninja
  - eigen
  - boost
  - zlib

  # =========================
  # Pip dependencies
  # =========================
  - pip:
      # PyTorch CUDA 12.8
      - torch==2.7.0+cu128
      - torchvision==0.22.0+cu128
      - --extra-index-url https://download.pytorch.org/whl/cu128

      # CLI / config
      - click
      - hydra-core
      - omegaconf
      - tyro
      - rich

      # Vision / math
      - einops
      - kornia
      - timm
      - transformers
      - opencv-python
      - scikit-image
      - matplotlib
      - imageio[ffmpeg]
      - OpenEXR<3.3.0

      # VIPE / research tooling
      - python-pycg
      - rerun-sdk
      - viser
      - ray
