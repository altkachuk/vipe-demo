name: vipe
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Core
  - python=3.11
  - pip
  - numpy
  - scipy
  - tqdm
  - pyyaml

  # CUDA
  - pytorch
  - pytorch-cuda=12.1
  - torchvision

  # Vision / geometry
  - opencv
  - scikit-image
  - imageio
  - imageio-ffmpeg

  # System & utilities
  - cmake
  - ninja
  - eigen
  - boost

  # Python-only deps
  - pip:
      - gdown
      - matplotlib
      - rich
      - tyro
