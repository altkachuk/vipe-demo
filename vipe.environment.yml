name: vipe
channels:
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip
  - numpy
  - colmap
  - cuda-version=12
  
  - pip:
    - torch==2.7.0+cu128
    - torchvision==0.22.0+cu128
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - hydra-core
    - transformers==4.30.2